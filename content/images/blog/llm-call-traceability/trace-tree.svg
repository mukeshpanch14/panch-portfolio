<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 364" width="760" height="364" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="t">Trace tree for an agent request</title>
  <desc id="d">A handle_request root span containing a retrieval span, an LLM call, a tool call and a second LLM call, drawn as bars on a timeline.</desc>
  <rect width="760" height="364" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#0f172a">One request = one trace, made of nested spans</text>

  <!-- timeline grid -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="270" y1="56" x2="270" y2="268"/>
    <line x1="390" y1="56" x2="390" y2="268"/>
    <line x1="510" y1="56" x2="510" y2="268"/>
    <line x1="630" y1="56" x2="630" y2="268"/>
    <line x1="740" y1="56" x2="740" y2="268"/>
  </g>
  <text x="270" y="52" font-size="11" fill="#64748b" text-anchor="middle">time →</text>

  <!-- tree connectors -->
  <g stroke="#94a3b8" stroke-width="1.5" fill="none">
    <path d="M34 90 V231 M34 117 H48 M34 155 H48 M34 193 H48 M34 231 H48"/>
  </g>

  <!-- row labels -->
  <g font-size="13" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="24" y="82" font-weight="600">handle_request</text>
    <text x="52" y="122">retrieve_documents</text>
    <text x="52" y="160">chat claude-sonnet</text>
    <text x="52" y="198">execute_tool search_orders</text>
    <text x="52" y="236">chat claude-sonnet</text>
  </g>

  <!-- span bars -->
  <rect x="270" y="66" width="470" height="22" rx="4" fill="#475569"/>
  <rect x="270" y="106" width="70" height="22" rx="4" fill="#0d9488"/>
  <rect x="340" y="144" width="150" height="22" rx="4" fill="#2563eb"/>
  <rect x="490" y="182" width="80" height="22" rx="4" fill="#d97706"/>
  <rect x="570" y="220" width="150" height="22" rx="4" fill="#2563eb"/>

  <!-- bar labels -->
  <g font-size="11" fill="#ffffff">
    <text x="278" y="81">root span</text>
    <text x="278" y="121">retrieval</text>
    <text x="348" y="159">LLM call · CLIENT span</text>
    <text x="498" y="197">tool call</text>
    <text x="578" y="235">LLM call</text>
  </g>

  <!-- attribute callout -->
  <rect x="24" y="276" width="712" height="70" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="38" y="296" font-size="12" font-weight="600" fill="#1e3a8a">Each LLM span carries</text>
  <text x="38" y="314" font-size="11.5" fill="#1e3a8a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">gen_ai.request.model · gen_ai.response.finish_reasons</text>
  <text x="38" y="332" font-size="11.5" fill="#1e3a8a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">gen_ai.usage.input_tokens · gen_ai.usage.output_tokens</text>
</svg>
